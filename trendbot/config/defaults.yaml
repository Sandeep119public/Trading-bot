data:
  source: delta_india
  timeframe: 1d
  quote_currency: USD
  start_date: "2020-01-01"
  end_date: null
  overwrite: false

universe:
  mode: static
  symbols:
    - BTCUSD
    - ETHUSD
    - SOLUSD
  top_n: 50
  liquidity_window: 21
  rebalance_frequency: monthly
  rebalance_day: 1
  exclude_stablecoins: true
  min_volume_days: 15

strategy:
  lookbacks:
    - 5
    - 10
    - 21
    - 42
  allow_short: true

volatility:
  vol_window: 21
  ann_factor: 365

risk:
  target_portfolio_vol: 0.10
  max_gross_leverage: 1.0

execution:
  taker_fee_pct: 0.001
  maker_fee_pct: 0.0005
  slippage_pct: 0.0005
  rebalance_threshold: 0.01

backtest:
  min_history: 60
  benchmark: equal_weight
